name: Render 24/7 Keep-Alive Cron

on:
  schedule:
    # Runs every 14 minutes to prevent Render Free Tier 15-minute idle spin-down
    - cron: "*/14 * * * *"
  workflow_dispatch:

jobs:
  ping-render-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend Health Endpoint (Masked Secret)
        env:
          RENDER_BACKEND_URL: ${{ secrets.RENDER_BACKEND_URL || vars.RENDER_BACKEND_URL }}
        run: |
          if [ -z "$RENDER_BACKEND_URL" ]; then
            echo "RENDER_BACKEND_URL is not configured in GitHub Secrets."
            exit 0
          fi
          TARGET="${RENDER_BACKEND_URL%/}/api/v1/health?source=keepalive-cron"
          STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" --retry 3 --retry-delay 5 --max-time 30 -H "X-Keep-Alive-Cron: true" "$TARGET")
          echo "Keep-alive ping completed with HTTP status: $STATUS_CODE at $(date -u)"
          if [ "$STATUS_CODE" -ge 200 ] && [ "$STATUS_CODE" -lt 400 ]; then
            exit 0
          else
            exit 1
          fi